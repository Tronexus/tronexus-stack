<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffcc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00aaff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <polygon points="100,8 185,55 185,145 100,192 15,145 15,55"
    fill="none" stroke="url(#hexGrad)" stroke-width="2.5" filter="url(#glow)" opacity="0.9"/>
  <polygon points="100,22 172,64 172,136 100,178 28,136 28,64"
    fill="none" stroke="url(#hexGrad)" stroke-width="1" opacity="0.3"/>
  <polygon points="100,38 160,73 160,127 100,162 40,127 40,73"
    fill="#0a0e1a" stroke="url(#hexGrad)" stroke-width="1.5" filter="url(#glow)" opacity="0.8"/>
  <line x1="100" y1="8" x2="100" y2="22" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
  <line x1="185" y1="55" x2="172" y2="64" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
  <line x1="185" y1="145" x2="172" y2="136" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
  <line x1="100" y1="192" x2="100" y2="178" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
  <line x1="15" y1="145" x2="28" y2="136" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
  <line x1="15" y1="55" x2="28" y2="64" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
  <rect x="68" y="72" width="64" height="10" rx="2" fill="url(#innerGrad)" filter="url(#softglow)"/>
  <rect x="93" y="72" width="14" height="58" rx="2" fill="url(#innerGrad)" filter="url(#softglow)"/>
  <circle cx="100" cy="8" r="3" fill="#00d4ff" filter="url(#glow)"/>
  <circle cx="185" cy="55" r="3" fill="#00d4ff" filter="url(#glow)"/>
  <circle cx="185" cy="145" r="3" fill="#00d4ff" filter="url(#glow)"/>
  <circle cx="100" cy="192" r="3" fill="#00d4ff" filter="url(#glow)"/>
  <circle cx="15" cy="145" r="3" fill="#00d4ff" filter="url(#glow)"/>
  <circle cx="15" cy="55" r="3" fill="#00d4ff" filter="url(#glow)"/>
</svg>
